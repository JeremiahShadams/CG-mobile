name: Bug report
description: Something broke? Tell us what happened.
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: I tapped Scan and expected the camera to open…
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened instead?
      placeholder: The app froze on a black screen…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open app 2. Tap Scan 3. …
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device + OS (e.g. Pixel 7, Android 14 / iPhone 13, iOS 17)
      placeholder: …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version (from app.json)
      placeholder: 1.0.0
